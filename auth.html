<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belépés - PénzTár</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js" defer></script>
    <script src="auth.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fef7ed',
                            100: '#fdedd3',
                            200: '#fbd9a5',
                            300: '#f8bc6d',
                            400: '#f59e0b',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.8s ease-in-out',
                        'slide-in': 'slideIn 0.6s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideIn: {
                            '0%': { transform: 'translateX(-50px)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .bg-gradient-warm {
            background: linear-gradient(135deg, #fef7ed 0%, #fdedd3 25%, #fbd9a5 50%, #f8bc6d 75%, #f59e0b 100%);
        }
        .text-gradient {
            background: linear-gradient(135deg, #f59e0b, #d97706, #b45309);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-gradient-warm min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full animate-fade-in">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center space-x-3 mb-4">
                <div class="w-12 h-12 bg-gradient-to-br from-primary-500 to-primary-600 rounded-xl flex items-center justify-center">
                    <i class="fas fa-wallet text-white text-xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gradient">PénzTár</h1>
            </div>
            <p class="text-gray-600">Lépj be a fiókodba</p>
        </div>

        <!-- Auth Form Container -->
        <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl p-8 border border-orange-200/50">
            <!-- Login Form -->
            <div id="loginForm" class="animate-slide-in">
                <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Belépés</h2>

                <form id="loginFormElement" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email cím</label>
                        <input type="email" id="loginEmail" required
                               class="w-full px-4 py-3 border border-orange-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-300"
                               placeholder="email@example.com">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Jelszó</label>
                        <div class="relative">
                            <input type="password" id="loginPassword" required
                                   class="w-full px-4 py-3 border border-orange-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-300 pr-12"
                                   placeholder="••••••••">
                            <button type="button" id="toggleLoginPassword" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div id="loginError" class="hidden bg-red-50 border border-red-200 rounded-xl p-3 text-red-700 text-sm"></div>
                    <div id="loginSuccess" class="hidden bg-green-50 border border-green-200 rounded-xl p-3 text-green-700 text-sm"></div>

                    <button type="submit" class="w-full px-6 py-3 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl hover:from-primary-600 hover:to-primary-700 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 font-semibold">
                        <i class="fas fa-sign-in-alt mr-2"></i>Belépés
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-gray-600">Még nincs fiókod?
                        <button id="showRegisterBtn" class="text-primary-600 hover:text-primary-700 font-semibold">Regisztrálj itt</button>
                    </p>
                    <p class="text-sm mt-2">
                        <button id="showForgotPasswordBtn" class="text-gray-500 hover:text-gray-700">Elfelejtetted a jelszavad?</button>
                    </p>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="hidden">
                <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Regisztráció</h2>

                <form id="registerFormElement" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Teljes név</label>
                        <input type="text" id="registerName" required
                               class="w-full px-4 py-3 border border-orange-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-300"
                               placeholder="Teljes neved">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email cím</label>
                        <input type="email" id="registerEmail" required
                               class="w-full px-4 py-3 border border-orange-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-300"
                               placeholder="email@example.com">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Jelszó</label>
                        <div class="relative">
                            <input type="password" id="registerPassword" required
                                   class="w-full px-4 py-3 border border-orange-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-300 pr-12"
                                   placeholder="••••••••" minlength="6">
                            <button type="button" id="toggleRegisterPassword" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">Minimum 6 karakter</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Jelszó megerősítése</label>
                        <div class="relative">
                            <input type="password" id="registerConfirmPassword" required
                                   class="w-full px-4 py-3 border border-orange-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-300 pr-12"
                                   placeholder="••••••••" minlength="6">
                            <button type="button" id="toggleConfirmPassword" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div id="registerError" class="hidden bg-red-50 border border-red-200 rounded-xl p-3 text-red-700 text-sm"></div>
                    <div id="registerSuccess" class="hidden bg-green-50 border border-green-200 rounded-xl p-3 text-green-700 text-sm"></div>

                    <button type="submit" class="w-full px-6 py-3 bg-gradient-to-r from-emerald-500 to-emerald-600 text-white rounded-xl hover:from-emerald-600 hover:to-emerald-700 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 font-semibold">
                        <i class="fas fa-user-plus mr-2"></i>Regisztráció
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-gray-600">Már van fiókod?
                        <button id="showLoginBtn" class="text-primary-600 hover:text-primary-700 font-semibold">Lépj be itt</button>
                    </p>
                </div>
            </div>

            <!-- Forgot Password Form -->
            <div id="forgotPasswordForm" class="hidden">
                <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Elfelejtett jelszó</h2>
                <form id="forgotPasswordFormElement" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email cím</label>
                        <input type="email" id="forgotPasswordEmail" required
                               class="w-full px-4 py-3 border border-orange-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-300"
                               placeholder="email@example.com">
                    </div>
                    <div id="forgotPasswordError" class="hidden bg-red-50 border border-red-200 rounded-xl p-3 text-red-700 text-sm"></div>
                    <div id="forgotPasswordSuccess" class="hidden bg-green-50 border border-green-200 rounded-xl p-3 text-green-700 text-sm"></div>
                    <button type="submit" class="w-full px-6 py-3 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl hover:from-primary-600 hover:to-primary-700 transition-all duration-300 shadow-lg">
                        Jelszó-visszaállító link küldése
                    </button>
                </form>
                <div class="mt-6 text-center">
                    <p class="text-gray-600">Vissza a
                        <button id="showLoginFromForgotBtn" class="text-primary-600 hover:text-primary-700 font-semibold">bejelentkezéshez</button>
                    </p>
                </div>
            </div>

            <!-- Reset Password Form -->
            <div id="resetPasswordForm" class="hidden">
                <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Új jelszó beállítása</h2>
                <form id="resetPasswordFormElement" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Új jelszó</label>
                        <input type="password" id="resetPassword" required
                               class="w-full px-4 py-3 border border-orange-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-300"
                               placeholder="••••••••" minlength="6">
                    </div>
                    <div id="resetPasswordError" class="hidden bg-red-50 border border-red-200 rounded-xl p-3 text-red-700 text-sm"></div>
                    <div id="resetPasswordSuccess" class="hidden bg-green-50 border border-green-200 rounded-xl p-3 text-green-700 text-sm"></div>
                    <button type="submit" class="w-full px-6 py-3 bg-gradient-to-r from-emerald-500 to-emerald-600 text-white rounded-xl hover:from-emerald-600 hover:to-emerald-700 transition-all duration-300 shadow-lg">
                        Jelszó frissítése
                    </button>
                </form>
            </div>
        </div>

        <!-- Back to Landing -->
        <div class="text-center mt-6">
            <button id="backToLandingBtn" class="text-gray-600 hover:text-gray-800 transition-colors duration-300">
                <i class="fas fa-arrow-left mr-2"></i>Vissza a főoldalra
            </button>
        </div>
    </div>

</body>
</html>
